extends: ./electron-builder.yml
directories:
  output: release/nsis
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Standalone installer (~150 MB, Electron + frontend only).
  # Python environment (model/) is external — deployed separately.
  # After install + model deployment:
  #   Program Files\Ret\
  #     Ret.exe
  #     model\              ← Python 环境（外部部署）
  #     resources\
  #       app.asar
  #       web\ (frontend)
