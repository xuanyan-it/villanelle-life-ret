appId: com.ret.desktop
productName: Ret
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - node_modules/sqlite3/**/*
extraResources:
  - from: ../frontend/dist
    to: web
    filter:
      - "**/*"
  - from: assets/app.ico
    to: assets/app.ico
win:
  icon: app.ico
  signAndEditExecutable: false
publish: null
