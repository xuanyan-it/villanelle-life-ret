appId: com.ret.desktop
productName: Ret
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - node_modules/sqlite3/**/*
extraResources:
  - from: ../frontend/dist
    to: web
    filter:
      - "**/*"
  - from: ../assets/models
    to: assets/models
    filter:
      - "**/*"
      - "!test-data/**"
      - "!**/*.svs"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
  # NumPy 2.x imports this vendored pd_NA helper from numpy.testing at
  # runtime. The generic tests exclusion above would otherwise remove it
  # and make SciPy fail to import in packaged builds.
  - from: ../assets/models/venv-LMN-1.0/Lib/site-packages/numpy/_core/tests
    to: assets/models/venv-LMN-1.0/Lib/site-packages/numpy/_core/tests
    filter:
      - "__init__.py"
      - "_natype.py"
  - from: ../assets/openslide
    to: assets/openslide
    filter:
      - "**/*"
win:
  icon: assets/app.ico
  signAndEditExecutable: false
publish: null
