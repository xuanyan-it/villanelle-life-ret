appId: com.ret.desktop
productName: Ret
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - node_modules/sqlite3/**/*
extraResources:
  - from: ../frontend/dist
    to: web
    filter:
      - "**/*"
  - from: ../assets/models
    to: assets/models
    filter:
      - "**/*"
      - "!venv-LMN-1.0/**"
      - "!python-runtime/**"
      - "!test-data/**"
      - "!**/*.svs"
      - "!**/*.pt"
  - from: ../assets/openslide
    to: assets/openslide
    filter:
      - "**/*"
win:
  icon: assets/app.ico
  signAndEditExecutable: false
publish: null
