appId: com.ret.desktop
productName: Ret
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - node_modules/sqlite3/**/*
extraResources:
  - from: ../frontend/dist
    to: web
    filter:
      - "**/*"
  # NSIS standalone: everything bundled under model/
  - from: ../assets/models
    to: model
  - from: ../assets/openslide
    to: model/openslide
win:
  icon: assets/app.ico
  signAndEditExecutable: false
publish: null
