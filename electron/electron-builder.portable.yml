extends: ./electron-builder.yml
directories:
  output: release/portable
win:
  target:
    - target: portable
      arch:
        - x64
portable:
  splashImage: assets/portable-splash.bmp
  # Portable / USB mode: Python runtime, models, and OpenSlide live as
  # plain files next to the .exe on the USB drive (NOT inside resources/).
  # The app resolves them via PORTABLE_EXECUTABLE_DIR at runtime.
  # The extraResources from the base config are included, but at runtime
  # the portable uses PORTABLE_EXECUTABLE_DIR first.
  #
  # USB drive layout:
  #   Ret\
  #     Ret.exe
  #     assets\
  #       models\          ← python-runtime, venv-LMN-1.0, worker.py, *.pt
  #       openslide\       ← OpenSlide binaries
  unpackDirName: ret-app
