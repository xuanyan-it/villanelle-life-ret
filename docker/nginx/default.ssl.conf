#
# TLS-enabled nginx config (production).
# Used only when NGINX_SSL_ENABLED=true (see nginx-entrypoint.sh).
#

# HTTP server:
# Keep /health on HTTP for docker-compose health checks,
# redirect other paths to HTTPS.
server {
  listen 80;
  server_name ret.villanelle-life.com.cn;
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 50m;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    set $api_upstream http://api:7001;
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server:
server {
  listen 443 ssl;
  server_name ret.villanelle-life.com.cn;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50m;

  root /usr/share/nginx/html;
  index index.html;

  # Certbot-managed certs (mounted into container in prod compose).
  ssl_certificate /etc/letsencrypt/live/ret.villanelle-life.com.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ret.villanelle-life.com.cn/privkey.pem;

  # Keep SSL settings self-contained (avoid hard dependency on Certbot extras).
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location = /health {
    set $api_upstream http://api:7001;
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    set $api_upstream http://api:7001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Web requests might include keep-alive headers; keep it permissive.
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

