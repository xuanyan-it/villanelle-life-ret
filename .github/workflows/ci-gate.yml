name: CI Gate

on:
  pull_request:
    branches:
      - dev
      - test
      - master

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm repo:lint

      - name: Typecheck
        run: pnpm repo:typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm repo:test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit
    env:
      # parseServerEnv requires a syntactically valid postgres URL; value lives in repo secrets.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @villanelle/ret-shared build
      - name: Run DB migrations for server
        run: pnpm --filter @villanelle/ret-server db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Full browser E2E (`pnpm test:e2e` = server + Playwright) needs Postgres + migrations.
      # CI only runs server Vitest E2E; run `pnpm test:e2e` locally or in a separate job with services.
      - name: Run server E2E tests
        run: pnpm test:server:e2e
